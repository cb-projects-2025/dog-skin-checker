<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="AI Skin Screening Tool for Dogs" />
<title>Dermatology AI | Skin Checker</title>

<!-- Fonts: Inter for a crisp, medical-grade UI -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<!-- TensorFlow.js -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>

<style>
  :root {
    /* High-contrast, premium SaaS palette */
    --bg-page: #F4F4F5;
    --surface: #FFFFFF;
    --text-primary: #09090B;
    --text-secondary: #71717A;
    --border: #E4E4E7;
    --border-hover: #A1A1AA;
    --accent: #18181B;
    --accent-hover: #27272A;
    --healthy: #10B981;
    --issue: #EAB308;
    
    --font-sans: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    
    --shadow-subtle: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    --shadow-float: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
    --radius-lg: 16px;
    --radius-md: 10px;
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }

  /* Compact Widget Container */
  .app-widget {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-float);
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(0,0,0,0.04);
  }

  /* Compact Hero Banner */
  .widget-hero {
    height: 140px;
    width: 100%;
    position: relative;
    background: #E5E7EB;
  }

  .widget-hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
  }

  .widget-hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.6) 100%);
  }

  .hero-text {
    position: absolute;
    bottom: 16px;
    left: 24px;
    right: 24px;
    z-index: 2;
    color: #FFFFFF;
  }

  .hero-text h1 {
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 2px;
  }

  .hero-text p {
    font-size: 0.85rem;
    color: rgba(255, 255, 255, 0.85);
  }

  /* App Content Area */
  .widget-content {
    padding: 24px;
  }

  /* Compact Upload Zone */
  #dropzone {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius-md);
    padding: 24px 20px;
    text-align: center;
    cursor: pointer;
    transition: all var(--transition);
    background: #FAFAFA;
    position: relative;
  }

  #dropzone:hover, #dropzone.drag {
    border-color: var(--border-hover);
    background: var(--surface);
  }

  .upload-icon {
    color: var(--text-secondary);
    margin-bottom: 10px;
    transition: transform var(--transition);
  }

  #dropzone:hover .upload-icon {
    transform: translateY(-2px);
    color: var(--text-primary);
  }

  #dropText {
    font-size: 0.9rem;
    color: var(--text-secondary);
  }

  #dropText strong {
    color: var(--text-primary);
    font-weight: 600;
  }

  /* Preview State */
  #previewWrap {
    display: none;
    width: 100%;
  }

  #preview {
    width: 100%;
    height: 180px;
    border-radius: var(--radius-md);
    object-fit: cover;
    box-shadow: var(--shadow-subtle);
    border: 1px solid var(--border);
  }

  #changePhoto {
    margin-top: 12px;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-secondary);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: color var(--transition);
  }

  #changePhoto:hover { color: var(--text-primary); }

  /* Submit Button */
  button#submitBtn {
    width: 100%;
    margin-top: 20px;
    background: var(--accent);
    color: #FFFFFF;
    border: none;
    border-radius: var(--radius-md);
    padding: 14px;
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  button#submitBtn:hover:not(:disabled) { background: var(--accent-hover); }
  button#submitBtn:active:not(:disabled) { transform: scale(0.98); }
  button#submitBtn:disabled {
    background: #F4F4F5;
    color: #A1A1AA;
    cursor: not-allowed;
    border: 1px solid var(--border);
  }

  /* Status */
  #status, #error {
    font-size: 0.8rem;
    text-align: center;
    margin-top: 12px;
    min-height: 1.2em;
    font-weight: 500;
  }
  #status { color: var(--text-secondary); }
  #error { color: #EF4444; }

  /* Spinner */
  .spin {
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #FFF;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Results Section */
  #result {
    display: none;
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    animation: slideDown 0.3s ease forwards;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 20px;
  }

  .label-tiny {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }

  .primary-diagnosis {
    font-size: 1.35rem;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  .primary-confidence {
    font-family: var(--font-mono);
    font-size: 1.2rem;
    font-weight: 600;
    text-align: right;
  }

  /* Dense Data Bars */
  .bar-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    font-size: 0.8rem;
  }

  .bar-name {
    width: 110px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
    color: var(--text-secondary);
  }
  
  .bar-row:first-child .bar-name {
    color: var(--text-primary);
    font-weight: 600;
  }

  .bar-track {
    flex: 1;
    height: 6px;
    background: #F4F4F5;
    border-radius: 4px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .bar-pct {
    width: 45px;
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-secondary);
    text-align: right;
  }

  /* Disclaimer */
  .disclaimer {
    margin-top: 24px;
    padding: 12px 16px;
    background: #F9FAFB;
    border-radius: 8px;
    font-size: 0.75rem;
    color: var(--text-secondary);
    line-height: 1.5;
    border: 1px solid var(--border);
  }

  .disclaimer strong {
    color: var(--text-primary);
  }

</style>
</head>
<body>

<main class="app-widget">
  
  <!-- Compact Hero Banner -->
  <div class="widget-hero">
    <img src="https://images.unsplash.com/photo-1544568100-847a948585b9?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Healthy dog" />
    <div class="hero-text">
      <h1>Skin Screening AI</h1>
      <p>Secure, on-device dermatology analysis</p>
    </div>
  </div>

  <div class="widget-content">
    
    <!-- Upload Zone -->
    <div id="dropzone" role="button" tabindex="0" aria-label="Upload a photo">
      <input type="file" id="fileInput" accept="image/*" style="display:none" aria-hidden="true" />
      
      <div class="upload-state" id="uploadState">
        <svg class="upload-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <div id="dropText"><strong>Select a photo</strong> or drag and drop</div>
      </div>
      
      <div id="previewWrap">
        <img id="preview" alt="Preview" />
        <button id="changePhoto" type="button">Change photo</button>
      </div>
    </div>

    <!-- Action Button -->
    <button id="submitBtn" disabled>
      <span class="spin" id="spinner"></span>
      <span id="btnLabel">Loading engine...</span>
    </button>
    
    <div id="status"></div>
    <div id="error"></div>

    <!-- Results Section -->
    <div id="result">
      <div class="result-header">
        <div>
          <div class="label-tiny">Assessment</div>
          <div class="primary-diagnosis" id="topClass">—</div>
        </div>
        <div>
          <div class="label-tiny" style="text-align: right;">Confidence</div>
          <div class="primary-confidence" id="topConf">—</div>
        </div>
      </div>
      
      <div id="barList"></div>
      
      <div class="disclaimer">
        <strong>Not a diagnosis.</strong> This tool provides an AI screening running securely in your browser. Always consult a licensed veterinarian for medical advice.
      </div>
    </div>

  </div>
</main>

<script>
  const IMG_SIZE = 256;
  const CLASS_NAMES = [
    "Dermatitis",
    "Fungal_infections",
    "Healthy",
    "Hypersensitivity",
    "demodicosis",
    "ringworm"
  ];
  
  const CLASS_COLOR = (name) => name.toLowerCase() === 'healthy' ? 'var(--healthy)' : 'var(--issue)';

  const formatClassName = (name) => {
    const cleanName = name.replace(/_/g, ' ');
    return cleanName.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
  };

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const uploadState = document.getElementById('uploadState');
  const previewWrap = document.getElementById('previewWrap');
  const preview = document.getElementById('preview');
  const changePhoto = document.getElementById('changePhoto');
  const submitBtn = document.getElementById('submitBtn');
  const btnLabel = document.getElementById('btnLabel');
  const spinner = document.getElementById('spinner');
  const statusDiv = document.getElementById('status');
  const errorDiv = document.getElementById('error');
  const resultDiv = document.getElementById('result');
  const topClass = document.getElementById('topClass');
  const topConf = document.getElementById('topConf');
  const barList = document.getElementById('barList');

  let selectedFile = null;
  let model = null;

  async function loadModel() {
    try {
      statusDiv.textContent = 'Initializing AI...';
      model = await tf.loadGraphModel('tfjs_model/model.json');
      statusDiv.textContent = '';
      btnLabel.textContent = 'Run Screening';
      if (selectedFile) submitBtn.disabled = false;
    } catch (err) {
      statusDiv.textContent = '';
      errorDiv.textContent = 'Failed to load model: ' + err.message;
      btnLabel.textContent = 'System Offline';
    }
  }
  
  loadModel();

  // Drag and Drop Logic
  dropzone.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });
  dropzone.addEventListener('click', (e) => {
    if (e.target === changePhoto) return;
    fileInput.click();
  });
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('drag');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) handleFile(fileInput.files[0]);
  });
  changePhoto.addEventListener('click', (e) => {
    e.stopPropagation();
    fileInput.click();
  });

  function handleFile(file) {
    selectedFile = file;
    preview.src = URL.createObjectURL(file);
    uploadState.style.display = 'none';
    previewWrap.style.display = 'block';
    dropzone.style.padding = '12px';
    if (model) submitBtn.disabled = false;
    errorDiv.textContent = '';
    resultDiv.style.display = 'none';
  }

  submitBtn.addEventListener('click', async () => {
    if (!selectedFile || !model) return;
    submitBtn.disabled = true;
    btnLabel.textContent = 'Analyzing...';
    spinner.style.display = 'block';
    errorDiv.textContent = '';
    resultDiv.style.display = 'none';

    try {
      const scores = await runPrediction(preview);
      renderResult(scores);
    } catch (err) {
      errorDiv.textContent = err.message;
    } finally {
      submitBtn.disabled = false;
      btnLabel.textContent = 'Run Another Scan';
      spinner.style.display = 'none';
    }
  });

  async function runPrediction(imgElement) {
    const tensor = tf.tidy(() => {
      return tf.browser.fromPixels(imgElement)
        .resizeBilinear([IMG_SIZE, IMG_SIZE])
        .toFloat()
        .div(255.0)
        .expandDims(0);
    });

    const prediction = model.predict(tensor);
    const scoresArray = await prediction.data();
    tensor.dispose();
    prediction.dispose();

    const scores = {};
    CLASS_NAMES.forEach((name, i) => { scores[name] = scoresArray[i]; });
    return scores;
  }

  function renderResult(scores) {
    const entries = Object.entries(scores).sort((a, b) => b[1] - a[1]);
    const [leadName, leadScore] = entries[0];

    topClass.textContent = formatClassName(leadName);
    topClass.style.color = CLASS_COLOR(leadName);
    topConf.textContent = (leadScore * 100).toFixed(1) + '%';

    barList.innerHTML = '';
    entries.forEach(([name, score], i) => {
      const pct = (score * 100).toFixed(1);
      const row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML = `
        <div class="bar-name" title="${formatClassName(name)}">${formatClassName(name)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:0%; background:${CLASS_COLOR(name)}"></div></div>
        <div class="bar-pct">${pct}%</div>
      `;
      barList.appendChild(row);
      
      requestAnimationFrame(() => {
        setTimeout(() => { row.querySelector('.bar-fill').style.width = pct + '%'; }, 50);
      });
    });

    resultDiv.style.display = 'block';
  }
</script>
</body>
</html>
