<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Dog Skin Disease Checker</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    max-width: 480px;
    margin: 40px auto;
    padding: 0 16px;
    text-align: center;
    color: #222;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; }
  #dropzone {
    border: 2px dashed #aaa;
    border-radius: 12px;
    padding: 30px 16px;
    cursor: pointer;
    margin: 20px 0;
  }
  #dropzone.drag { border-color: #4a90e2; background: #f0f6ff; }
  #preview { max-width: 100%; max-height: 260px; margin-top: 12px; border-radius: 8px; display: none; }
  button {
    background: #4a90e2;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { background: #ccc; cursor: not-allowed; }
  #result { margin-top: 20px; text-align: left; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 0.9rem; }
  .bar-label { width: 130px; flex-shrink: 0; }
  .bar-bg { flex: 1; background: #eee; border-radius: 6px; overflow: hidden; height: 14px; }
  .bar-fill { background: #4a90e2; height: 100%; }
  #error { color: #c0392b; margin-top: 10px; }
</style>
</head>
<body>
  <h1>🐾 Dog Skin Disease Checker</h1>
  <p class="sub">Upload a clear photo of the affected skin area.<br>Screening tool only -- not a substitute for a vet.</p>

  <div id="dropzone">
    <input type="file" id="fileInput" accept="image/*" style="display:none" />
    <div id="dropText">Click or drag a photo here</div>
    <img id="preview" />
  </div>

  <button id="submitBtn" disabled>Check photo</button>
  <div id="error"></div>
  <div id="result"></div>

<script>
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const submitBtn = document.getElementById('submitBtn');
  const resultDiv = document.getElementById('result');
  const errorDiv = document.getElementById('error');
  let selectedFile = null;

  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('drag');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) handleFile(fileInput.files[0]);
  });

  function handleFile(file) {
    selectedFile = file;
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
    submitBtn.disabled = false;
    errorDiv.textContent = '';
    resultDiv.innerHTML = '';
  }

  submitBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Checking...';
    errorDiv.textContent = '';
    resultDiv.innerHTML = '';

    const formData = new FormData();
    formData.append('file', selectedFile);

    try {
      const res = await fetch('/predict/', { method: 'POST', body: formData });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || 'Prediction failed.');
      }
      const data = await res.json();
      renderResult(data);
    } catch (err) {
      errorDiv.textContent = err.message;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Check photo';
    }
  });

  function renderResult(data) {
    let html = `<h3>Prediction: ${data.prediction} (${(data.confidence * 100).toFixed(1)}%)</h3>`;
    const entries = Object.entries(data.all_scores).sort((a, b) => b[1] - a[1]);
    for (const [label, score] of entries) {
      const pct = (score * 100).toFixed(1);
      html += `
        <div class="bar-row">
          <span class="bar-label">${label}</span>
          <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
          <span>${pct}%</span>
        </div>`;
    }
    resultDiv.innerHTML = html;
  }
</script>
</body>
</html>
