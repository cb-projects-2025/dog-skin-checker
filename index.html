<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Skin Disease Classifier</title>
    <!-- Load TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
</head>
<body>

    <h2>Dog Skin Disease Classification</h2>
    <p id="status">Initializing model...</p>

    <!-- Image Input & Preview -->
    <input type="file" id="imageUpload" accept="image/*">
    <br><br>
    <img id="imagePreview" width="256" height="256" style="display:none; object-fit: cover;" crossorigin="anonymous"/>
    
    <h3 id="result"></h3>

    <script>
        let model;
        
        // Relative path to your model.json on GitHub Pages
        const MODEL_URL = './model.json';

        async function loadModel() {
            try {
                document.getElementById('status').innerText = "Loading model from GitHub Pages...";
                
                // Use tf.loadLayersModel for standard Colab/Keras models converted via tensorflowjs_converter
                model = await tf.loadLayersModel(MODEL_URL);
                
                document.getElementById('status').innerText = "Model loaded successfully! Ready for classification.";
            } catch (error) {
                console.error("Error loading model:", error);
                document.getElementById('status').innerText = "Error: Failed to load model. Check console for details.";
            }
        }

        const imageUpload = document.getElementById('imageUpload');
        imageUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || !model) return;

            const reader = new FileReader();
            reader.onload = async (event) => {
                const imgElement = document.getElementById('imagePreview');
                imgElement.src = event.target.result;
                imgElement.style.display = 'block';

                imgElement.onload = async () => {
                    document.getElementById('result').innerText = "Classifying...";

                    // Preprocess image to match training parameters (256x256, normalized to [0, 1])
                    const tensor = tf.tidy(() => {
                        return tf.browser.fromPixels(imgElement)
                            .resizeBilinear([256, 256])
                            .toFloat()
                            .div(tf.scalar(255.0))
                            .expandDims(0);
                    });

                    // Execute prediction using standard Layers Model prediction method
                    const predictionTensor = model.predict(tensor);
                    const predictions = await predictionTensor.data();
                    
                    // Clear tensors from web memory
                    tf.dispose([tensor, predictionTensor]);

                    // Classes listed precisely in training order
                    const classes = [
                        'Dermatitis', 
                        'Fungal_infections', 
                        'Healthy', 
                        'Hypersensitivity', 
                        'demodicosis', 
                        'ringworm'
                    ];

                    // Find highest prediction index and probability
                    let maxIndex = 0;
                    let maxProb = predictions[0];
                    for (let i = 1; i < predictions.length; i++) {
                        if (predictions[i] > maxProb) {
                            maxProb = predictions[i];
                            maxIndex = i;
                        }
                    }

                    document.getElementById('result').innerText = 
                        `Prediction: ${classes[maxIndex]} (${(maxProb * 100).toFixed(2)}%)`;
                };
            };
            reader.readAsDataURL(file);
        });

        loadModel();
    </script>
</body>
</html>
