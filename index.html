<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skin Screening — for dogs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  // NOTE: no custom layer registration needed anymore.
  // The model is exported as a tfjs GRAPH model (converted from a
  // SavedModel at the op level), so every op TensorFlow supports just
  // works in the browser — there's nothing left to patch.

  const IMG_SIZE = 256;
  const CLASS_NAMES = [
    "Dermatitis",
    "Fungal_infections",
    "Healthy",
    "Hypersensitivity",
    "demodicosis",
    "ringworm",
  ];
  const CLASS_COLOR = (name) => name.toLowerCase() === 'healthy' ? '#6E8F6C' : '#C8892C';

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const dropText = document.getElementById('dropText');
  const previewWrap = document.getElementById('previewWrap');
  const preview = document.getElementById('preview');
  const changePhoto = document.getElementById('changePhoto');
  const submitBtn = document.getElementById('submitBtn');
  const btnLabel = document.getElementById('btnLabel');
  const spinner = document.getElementById('spinner');
  const statusDiv = document.getElementById('status');
  const errorDiv = document.getElementById('error');
  const resultDiv = document.getElementById('result');
  const topClass = document.getElementById('topClass');
  const topConf = document.getElementById('topConf');
  const barList = document.getElementById('barList');

  let selectedFile = null;
  let model = null;

  async function loadModel() {
    try {
      statusDiv.textContent = 'Loading model…';
      // Graph model folder (converted with --output_format=tfjs_graph_model)
      model = await tf.loadGraphModel('tfjs_model/model.json');
      statusDiv.textContent = '';
      btnLabel.textContent = 'Check photo';
      if (selectedFile) submitBtn.disabled = false;
    } catch (err) {
      statusDiv.textContent = '';
      errorDiv.textContent = 'Could not load model: ' + err.message;
      btnLabel.textContent = 'Model failed to load';
    }
  }
  loadModel();

  dropzone.addEventListener('click', (e) => {
    if (e.target === changePhoto) return;
    fileInput.click();
  });
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('drag');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) handleFile(fileInput.files[0]);
  });
  changePhoto.addEventListener('click', (e) => {
    e.stopPropagation();
    fileInput.click();
  });

  function handleFile(file) {
    selectedFile = file;
    preview.src = URL.createObjectURL(file);
    dropText.style.display = 'none';
    previewWrap.style.display = 'block';
    if (model) submitBtn.disabled = false;
    errorDiv.textContent = '';
    resultDiv.style.display = 'none';
  }

  submitBtn.addEventListener('click', async () => {
    if (!selectedFile || !model) return;
    submitBtn.disabled = true;
    btnLabel.textContent = 'Reading the photo…';
    spinner.style.display = 'inline-block';
    errorDiv.textContent = '';

    try {
      const scores = await runPrediction(preview);
      renderResult(scores);
    } catch (err) {
      errorDiv.textContent = err.message;
    } finally {
      submitBtn.disabled = false;
      btnLabel.textContent = 'Check photo';
      spinner.style.display = 'none';
    }
  });

  async function runPrediction(imgElement) {
    const tensor = tf.tidy(() => {
      return tf.browser.fromPixels(imgElement)
        .resizeBilinear([IMG_SIZE, IMG_SIZE])
        .toFloat()
        .div(255.0)
        .expandDims(0);
    });

    // Graph models expose the same .predict() API for simple feed-forward
    // networks like this CNN.
    const prediction = model.predict(tensor);
    const scoresArray = await prediction.data();
    tensor.dispose();
    prediction.dispose();

    const scores = {};
    CLASS_NAMES.forEach((name, i) => { scores[name] = scoresArray[i]; });
    return scores;
  }

  function renderResult(scores) {
    const entries = Object.entries(scores).sort((a, b) => b[1] - a[1]);
    const [leadName, leadScore] = entries[0];

    topClass.textContent = leadName.replace(/_/g, ' ');
    topClass.style.color = CLASS_COLOR(leadName);
    topConf.textContent = (leadScore * 100).toFixed(1) + '%';

    barList.innerHTML = '';
    entries.forEach(([name, score], i) => {
      const pct = (score * 100).toFixed(1);
      const row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML = `
        <div class="bar-name ${i === 0 ? 'top' : ''}">${name.replace(/_/g, ' ')}</div>
        <div class="bar-track"><div class="bar-fill" style="width:0%; background:${CLASS_COLOR(name)}"></div></div>
        <div class="bar-pct">${pct}%</div>
      `;
      barList.appendChild(row);
      requestAnimationFrame(() => {
        row.querySelector('.bar-fill').style.width = pct + '%';
      });
    });

    resultDiv.style.display = 'block';
    resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
</script>
</body>
</html>
